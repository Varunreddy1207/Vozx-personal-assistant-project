<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Google - VOZX AI</title>
  <link rel="stylesheet" href="styles.css?v=24.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #202124 !important;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      color: #e3e3e3;
    }
    .page-ambient-bg, .circuit-bg-overlay {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="google-chooser-window" style="padding: 24px 16px;">
    <div class="google-chooser-card">
      <!-- Card Header: Google G logo + Sign in with Google -->
      <div class="google-card-header">
        <div class="google-brand-tag">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.3l3.7 2.9C6.2 7.3 8.9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
            <path fill="#FBBC05" d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.3C.6 9.3 0 10.6 0 12s.6 2.7 1.6 4.7l3.7-1.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.3-6.7-5.2L1.6 16c1.9 3.7 5.8 7 10.4 7z"/>
          </svg>
          <span>Sign in with Google</span>
        </div>
        <button type="button" class="google-close-btn" onclick="window.history.back() || (window.location.href='index.html')" aria-label="Close" title="Cancel">✕</button>
      </div>

      <!-- Loading progress bar -->
      <div class="google-loading-bar" id="googleLoadingBar"></div>

      <!-- Main Two-Column Body -->
      <div class="google-card-body">
        <!-- Left Column: App Branding & Title -->
        <div class="google-left-col">
          <div class="google-app-emblem">
            <img src="assets/vozx-logo-icon.png" alt="VOZX AI Logo">
          </div>
          <h2 class="google-heading">Choose an account</h2>
          <p class="google-subheading">to continue to <span class="google-app-link">VOZX AI</span></p>
        </div>

        <!-- Right Column: Account Selection -->
        <div class="google-right-col">
          <!-- Primary Account: Varun Reddy -->
          <div class="google-account-item" id="btnVarunAccount" role="button" tabindex="0">
            <div class="google-avatar-wrap">
              <div class="google-avatar-img">VR</div>
            </div>
            <div class="google-account-details">
              <div class="google-account-name">VARUNREDDY MASIREDDY</div>
              <div class="google-account-email">varunreddymasireddy2007@gmail.com</div>
            </div>
          </div>

          <!-- Divider -->
          <div class="google-account-divider"></div>

          <!-- Use Another Account Option -->
          <div class="google-account-item google-use-another" id="btnUseAnother" role="button" tabindex="0">
            <div class="google-avatar-wrap google-icon-wrap">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="google-account-details">
              <div class="google-use-text">Use another account</div>
            </div>
          </div>

          <!-- Custom Account Input Block -->
          <div class="google-custom-account-block" id="customInputBlock" style="display: none;">
            <input type="email" id="customEmailInput" class="google-custom-input" placeholder="Enter your Google email">
            <button type="button" id="btnCustomSubmit" class="google-custom-submit-btn">Next</button>
          </div>

          <!-- Disclaimer Footer -->
          <p class="google-disclaimer">
            Before using this app, you can review VOZX AI's <a href="#" onclick="event.preventDefault()">Privacy Policy</a> and <a href="#" onclick="event.preventDefault()">Terms of Service</a>.
          </p>
        </div>
      </div>
    </div>

    <!-- Outer Bottom Footer -->
    <div class="google-outer-footer">
      <div class="google-lang-selector">
        <span>English (United Kingdom)</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="12,17 4,9 20,9"/>
        </svg>
      </div>
      <div class="google-footer-links">
        <a href="#" onclick="event.preventDefault()">Help</a>
        <a href="#" onclick="event.preventDefault()">Privacy</a>
        <a href="#" onclick="event.preventDefault()">Terms</a>
      </div>
    </div>
  </div>

  <script>
    function authenticateAndProceed(name, email) {
      const bar = document.getElementById('googleLoadingBar');
      if (bar) bar.classList.add('active');

      try {
        localStorage.setItem('vozx_is_logged_in', 'true');
        localStorage.setItem('vozx_user_name', name || 'Varun Reddy');
        localStorage.setItem('vozx_user_email', email || 'varunreddymasireddy2007@gmail.com');
        localStorage.setItem('vozx_current_screen', 'home');
      } catch (e) {}

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 700);
    }

    document.getElementById('btnVarunAccount')?.addEventListener('click', () => {
      authenticateAndProceed('VARUNREDDY MASIREDDY', 'varunreddymasireddy2007@gmail.com');
    });

    const useAnotherBtn = document.getElementById('btnUseAnother');
    const customBlock = document.getElementById('customInputBlock');
    const customInput = document.getElementById('customEmailInput');
    const customSubmit = document.getElementById('btnCustomSubmit');

    useAnotherBtn?.addEventListener('click', () => {
      if (customBlock) {
        customBlock.style.display = customBlock.style.display === 'none' ? 'flex' : 'none';
        if (customBlock.style.display === 'flex' && customInput) {
          customInput.focus();
        }
      }
    });

    customSubmit?.addEventListener('click', () => {
      const val = customInput?.value.trim() || 'User';
      const name = val.split('@')[0];
      const capitalized = name.charAt(0).toUpperCase() + name.slice(1);
      authenticateAndProceed(capitalized, val);
    });

    customInput?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') customSubmit?.click();
    });
  </script>
</body>
</html>
